configs:

  # Pula o processo de limpeza das imagens
  skip_clean: True

  # Pular geração das máscaras
  skip_masks: True

  mask_type: s2cloudless

  masks_path: data/03_cloud_masks/

  # Valores da máscara que representam nuvem e sombra de nuvem
  cloud_and_cloud_shadow_pixels: [1, 2]

  max_workers_image_reconstruction: 4

  reconstruction_algorithm: temporal_interpolation